<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header bg-warning">
        <h5 class="mb-0"><i class="bi bi-pencil me-2"></i>Modifier le Client</h5>
      </div>
      <div class="card-body">
        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" formControlName="name"
                   [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched">
            <div class="invalid-feedback">Le nom est obligatoire (min 3 caractères)</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" formControlName="email"
                   [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
            <div class="invalid-feedback">Email invalide</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning" [disabled]="form.invalid">
              <i class="bi bi-save me-1"></i>Mettre à jour
            </button>
            <a routerLink="/customers" class="btn btn-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow" style="width: 420px;">
    <div class="card-header bg-primary text-white text-center py-4">
      <i class="bi bi-bank2 fs-1"></i>
      <h4 class="mt-2 mb-0">Digital Banking</h4>
      <small>Connectez-vous à votre espace</small>
    </div>
    <div class="card-body p-4">
      <div class="alert alert-danger" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ errorMessage }}
      </div>
      <form [formGroup]="form" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-person me-1"></i>Nom d'utilisateur</label>
          <input type="text" class="form-control form-control-lg" formControlName="username"
                 placeholder="Entrez votre identifiant">
        </div>
        <div class="mb-4">
          <label class="form-label"><i class="bi bi-lock me-1"></i>Mot de passe</label>
          <input type="password" class="form-control form-control-lg" formControlName="password"
                 placeholder="Entrez votre mot de passe">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="form.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i class="bi bi-box-arrow-in-right me-2" *ngIf="!loading"></i>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">admin / admin123 &nbsp;|&nbsp; user / user123</small>
      </div>
    </div>
  </div>
</div>

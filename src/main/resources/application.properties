spring.application.name=ebanking-backend
spring.config.import=optional:classpath:application-secret.properties

# ==============================
# H2 In-Memory Database (dev)
# ==============================
spring.datasource.url=jdbc:h2:mem:ebank-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# Server
# ==============================
server.port=8085

# ==============================
# Springdoc / Swagger UI
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==============================
# JWT
# ==============================
jwt.secret=DigitalBankingSecretKey2024EbankingAppSecureTokenKey
jwt.expiration=86400000

# ==============================
# OpenAI / Spring AI
# Set your key in application-secret.properties
# ==============================
spring.ai.openai.api-key=${OPENAI_API_KEY:CHANGE_ME}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.model=text-embedding-ada-002

# ==============================
# Telegram Bot (optional)
# Set telegram.bot.enabled=true and configure token/username
# ==============================
telegram.bot.enabled=false
telegram.bot.token=${TELEGRAM_BOT_TOKEN:CHANGE_ME}
